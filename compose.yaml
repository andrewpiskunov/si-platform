services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: si
      POSTGRES_DB: si
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U si -d si"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build: .
    image: si-platform-core:local
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://si:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/si?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: si-platform-core:local
    environment:
      DATABASE_URL: postgres://si:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/si?sslmode=disable
      LISTEN_ADDR: "0.0.0.0:8080"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./web
    environment:
      API_ORIGIN: http://api:8080
      ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - api
  edge:
    image: caddy:2.11.7-alpine
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
volumes:
  app-data:
  postgres-data:
